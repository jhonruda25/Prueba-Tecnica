services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: delamujer-productcatalog-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DatabaseProvider=PostgreSQL
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=delamujer_catalog;Username=postgres;Password=postgres
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: delamujer-postgres-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=delamujer_catalog
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d delamujer_catalog"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
